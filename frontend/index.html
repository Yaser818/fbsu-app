<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBSU Innovation Lab | مختبر الابتكار</title>
    <link rel="stylesheet"href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>FBSU Innovation Evaluator</h1>
            <p>مختبر جامعة الأمير فهد بن سلطان لتقييم وتطوير الأفكار</p>
        </header>

        <main>
            <section class="input-section">
                <input type="text" id="ideaTitle" placeholder="اسم فكرة المشروع...">
                <textarea id="problemStatement" placeholder="ما هي المشكلة التي يحلها المشروع؟"></textarea>
                <textarea id="targetBeneficiary" placeholder="من هي الفئة المستهدفة؟"></textarea>
                <button id="evaluateBtn" onclick="evaluateIdea()">تحليل وتطوير الفكرة <i class="fas fa-magic"></i></button>
            </section>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>جاري تحليل الفكرة وبناء خارطة الطريق...</p>
            </div>

            <section id="results" class="hidden">
                <h2>نتائج التحليل والتوصيات</h2>
               
                <div class="scores-grid" id="scoresGrid"></div>

                <hr>

                <div class="development-lab">
                    <div class="dev-card improvement">
                        <h3><i class="fas fa-lightbulb"></i> مقترحات لتطوير الفكرة</h3>
                        <div id="improvementContent"></div>
                    </div>

                    <div class="dev-card technical">
                        <h3><i class="fas fa-code"></i> الأدوات التقنية المقترحة</h3>
                        <div id="techContent"></div>
                    </div>

                    <div class="dev-card vision">
                        <h3><i class="fas fa-rocket"></i> الرؤية المستقبلية (الاستدامة)</h3>
                        <div id="visionContent"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
